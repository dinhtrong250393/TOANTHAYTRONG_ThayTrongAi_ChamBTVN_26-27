<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 280px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background: #f8fafc;
        }
        h3 { color: #1e293b; margin-top: 0; }
        .status-box {
            background: #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #334155;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #dc2626; }
        .info { font-size: 12px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <h3>Zalo Auto Sender</h3>
    <div class="status-box" id="status">Đang rảnh</div>
    <button id="stopBtn">🛑 DỪNG KHẨN CẤP</button>
    <div class="info">
        Tiện ích sẽ lấy lệnh tự động từ hệ thống Web App. Không cần copy thủ công.
    </div>
    <script src="popup.js"></script>
</body>
</html>
